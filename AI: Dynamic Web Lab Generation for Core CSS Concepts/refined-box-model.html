<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Box Model Interactive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 40px;
      background: #f0f0f0;
    }

    .container {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .boxes {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Box 1 styles using background-clip to color content and padding */
    .box {
      position: relative;
      display: block;
      width: 200px;
      height: 200px;
      margin: 20px;
      padding: 20px;
      border-style: solid;
      border-color: black;
      border-width: 5px;
      border-radius: 0;
      background-color: #99ccff;
      background-clip: padding-box;
      cursor: default;
      box-sizing: content-box;
      color: #000;
      font-weight: bold;
      user-select: none;
      overflow: visible;
    }

    .box-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccffcc;
      padding: 0;
      pointer-events: none;
      border-radius: inherit;
    }

    /* Show margin area with a separate translucent box behind */
    .box-margin-wrapper {
      display: inline-block;
      background-color: #ffd699;
      position: relative;
      padding: 0;
      margin: 0;
      border-radius: 0;
    }

    .box-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 1.1em;
    }

    /* Box 2 for reference */
    .box2 {
      width: 200px;
      height: 200px;
      background-color: #ff9999;
      border: 5px solid black;
      margin: 20px;
      padding: 20px;
      user-select: none;
    }

    /* Control Panel */
    .control-panel {
      max-width: 350px;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 10px #ccc;
      overflow-y: auto;
      max-height: 90vh;
    }

    .control-panel h2 {
      margin-bottom: 10px;
    }

    .property-group {
      margin-bottom: 20px;
    }

    .property-group h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      font-weight: 600;
    }

    .slider-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 10px;
    }

    .slider-row label {
      flex: 1 0 70px;
      font-size: 0.9em;
    }

    .slider-row input[type="range"] {
      flex: 1 1 auto;
    }

    .slider-value {
      width: 40px;
      text-align: right;
      font-family: monospace;
      font-size: 0.9em;
    }

    select {
      width: 100%;
      font-size: 1em;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="boxes">

      <div
        class="box-margin-wrapper"
        id="box-margin-wrapper"
        style="margin: 20px; border-radius: 0;"
      >
        <div
          class="box"
          id="box1"
          style="border-width:5px; padding:20px; width:200px; display:block; border-radius:0;"
        >
          <div class="box-content"></div>
          <div class="box-label">Box 1</div>
        </div>
      </div>

      <div class="box2" id="box2">Box 2</div>
    </div>

    <div class="control-panel" aria-label="Control Panel">
      <h2>Control Panel</h2>

      <div class="property-group" aria-label="Margin controls">
        <h3>Margin (px)</h3>

        <div class="slider-row">
          <label for="margin-top">Top</label>
          <input type="range" id="margin-top" min="0" max="100" value="20" />
          <div class="slider-value" id="margin-top-val">20</div>
        </div>

        <div class="slider-row">
          <label for="margin-right">Right</label>
          <input type="range" id="margin-right" min="0" max="100" value="20" />
          <div class="slider-value" id="margin-right-val">20</div>
        </div>

        <div class="slider-row">
          <label for="margin-bottom">Bottom</label>
          <input type="range" id="margin-bottom" min="0" max="100" value="20" />
          <div class="slider-value" id="margin-bottom-val">20</div>
        </div>

        <div class="slider-row">
          <label for="margin-left">Left</label>
          <input type="range" id="margin-left" min="0" max="100" value="20" />
          <div class="slider-value" id="margin-left-val">20</div>
        </div>
      </div>

      <div class="property-group" aria-label="Padding controls">
        <h3>Padding (px)</h3>

        <div class="slider-row">
          <label for="padding-top">Top</label>
          <input type="range" id="padding-top" min="0" max="50" value="20" />
          <div class="slider-value" id="padding-top-val">20</div>
        </div>

        <div class="slider-row">
          <label for="padding-right">Right</label>
          <input type="range" id="padding-right" min="0" max="50" value="20" />
          <div class="slider-value" id="padding-right-val">20</div>
        </div>

        <div class="slider-row">
          <label for="padding-bottom">Bottom</label>
          <input type="range" id="padding-bottom" min="0" max="50" value="20" />
          <div class="slider-value" id="padding-bottom-val">20</div>
        </div>

        <div class="slider-row">
          <label for="padding-left">Left</label>
          <input type="range" id="padding-left" min="0" max="50" value="20" />
          <div class="slider-value" id="padding-left-val">20</div>
        </div>
      </div>

      <div class="property-group" aria-label="Border width controls">
        <h3>Border Width (px)</h3>

        <div class="slider-row">
          <label for="border-top">Top</label>
          <input type="range" id="border-top" min="0" max="20" value="5" />
          <div class="slider-value" id="border-top-val">5</div>
        </div>

        <div class="slider-row">
          <label for="border-right">Right</label>
          <input type="range" id="border-right" min="0" max="20" value="5" />
          <div class="slider-value" id="border-right-val">5</div>
        </div>

        <div class="slider-row">
          <label for="border-bottom">Bottom</label>
          <input type="range" id="border-bottom" min="0" max="20" value="5" />
          <div class="slider-value" id="border-bottom-val">5</div>
        </div>

        <div class="slider-row">
          <label for="border-left">Left</label>
          <input type="range" id="border-left" min="0" max="20" value="5" />
          <div class="slider-value" id="border-left-val">5</div>
        </div>
      </div>

      <div class="property-group">
        <h3>Width (px)</h3>

        <div class="slider-row">
          <label for="width">Box Width</label>
          <input type="range" id="width" min="100" max="500" value="200" />
          <div class="slider-value" id="width-val">200</div>
        </div>
      </div>

      <div class="property-group" aria-label="Border radius control">
        <h3>Border Radius (px)</h3>

        <div class="slider-row">
          <label for="border-radius">Radius</label>
          <input
            type="range"
            id="border-radius"
            min="0"
            max="100"
            value="0"
          />
          <div class="slider-value" id="border-radius-val">0</div>
        </div>
      </div>

      <div class="property-group">
        <h3>Display Property</h3>

        <select id="display">
          <option value="block" selected>Block</option>
          <option value="inline-block">Inline-Block</option>
          <option value="inline">Inline</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const box = document.getElementById('box1');
    const boxMarginWrapper = document.getElementById('box-margin-wrapper');
    const boxContent = box.querySelector('.box-content');

    const marginSliders = {
      top: document.getElementById('margin-top'),
      right: document.getElementById('margin-right'),
      bottom: document.getElementById('margin-bottom'),
      left: document.getElementById('margin-left'),
    };

    const marginValues = {
      top: document.getElementById('margin-top-val'),
      right: document.getElementById('margin-right-val'),
      bottom: document.getElementById('margin-bottom-val'),
      left: document.getElementById('margin-left-val'),
    };

    const paddingSliders = {
      top: document.getElementById('padding-top'),
      right: document.getElementById('padding-right'),
      bottom: document.getElementById('padding-bottom'),
      left: document.getElementById('padding-left'),
    };

    const paddingValues = {
      top: document.getElementById('padding-top-val'),
      right: document.getElementById('padding-right-val'),
      bottom: document.getElementById('padding-bottom-val'),
      left: document.getElementById('padding-left-val'),
    };

    const borderSliders = {
      top: document.getElementById('border-top'),
      right: document.getElementById('border-right'),
      bottom: document.getElementById('border-bottom'),
      left: document.getElementById('border-left'),
    };

    const borderValues = {
      top: document.getElementById('border-top-val'),
      right: document.getElementById('border-right-val'),
      bottom: document.getElementById('border-bottom-val'),
      left: document.getElementById('border-left-val'),
    };

    const widthSlider = document.getElementById('width');
    const widthValue = document.getElementById('width-val');

    const borderRadiusSlider = document.getElementById('border-radius');
    const borderRadiusValue = document.getElementById('border-radius-val');

    const displaySelect = document.getElementById('display');

    function updateBox() {
      const marginTop = marginSliders.top.value + 'px';
      const marginRight = marginSliders.right.value + 'px';
      const marginBottom = marginSliders.bottom.value + 'px';
      const marginLeft = marginSliders.left.value + 'px';

      const paddingTop = paddingSliders.top.value + 'px';
      const paddingRight = paddingSliders.right.value + 'px';
      const paddingBottom = paddingSliders.bottom.value + 'px';
      const paddingLeft = paddingSliders.left.value + 'px';

      const borderTop = borderSliders.top.value + 'px';
      const borderRight = borderSliders.right.value + 'px';
      const borderBottom = borderSliders.bottom.value + 'px';
      const borderLeft = borderSliders.left.value + 'px';

      const width = widthSlider.value + 'px';
      const borderRadius = borderRadiusSlider.value + 'px';
      const display = displaySelect.value;

      boxMarginWrapper.style.marginTop = marginTop;
      boxMarginWrapper.style.marginRight = marginRight;
      boxMarginWrapper.style.marginBottom = marginBottom;
      boxMarginWrapper.style.marginLeft = marginLeft;
      boxMarginWrapper.style.borderRadius = borderRadius;

      box.style.display = display;
      box.style.width = width;
      box.style.borderRadius = borderRadius;

      box.style.borderTopWidth = borderTop;
      box.style.borderRightWidth = borderRight;
      box.style.borderBottomWidth = borderBottom;
      box.style.borderLeftWidth = borderLeft;

      box.style.paddingTop = paddingTop;
      box.style.paddingRight = paddingRight;
      box.style.paddingBottom = paddingBottom;
      box.style.paddingLeft = paddingLeft;

      boxContent.style.borderRadius = borderRadius;

      for (const side in marginSliders) {
        marginValues[side].textContent = marginSliders[side].value;
      }

      for (const side in paddingSliders) {
        paddingValues[side].textContent = paddingSliders[side].value;
      }

      for (const side in borderSliders) {
        borderValues[side].textContent = borderSliders[side].value;
      }

      widthValue.textContent = widthSlider.value;
      borderRadiusValue.textContent = borderRadiusSlider.value;
    }

    for (const side in marginSliders) {
      marginSliders[side].addEventListener('input', updateBox);
    }

    for (const side in paddingSliders) {
      paddingSliders[side].addEventListener('input', updateBox);
    }

    for (const side in borderSliders) {
      borderSliders[side].addEventListener('input', updateBox);
    }

    widthSlider.addEventListener('input', updateBox);
    borderRadiusSlider.addEventListener('input', updateBox);
    displaySelect.addEventListener('change', updateBox);

    updateBox();
  </script>

</body>
</html>
